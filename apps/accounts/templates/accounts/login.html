{% extends "base.html" %}

{% block title %}ورود{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h5 mb-4 text-center">ورود به سامانه</h1>

        <form method="post">
          {% csrf_token %}

          {% if form.non_field_errors %}
            <div class="alert alert-danger">{{ form.non_field_errors.0 }}</div>
          {% endif %}

          <div class="mb-3">
            <label class="form-label" for="{{ form.username.id_for_label }}">{{ form.username.label }}</label>
            {{ form.username }}
          </div>

          <div class="mb-3">
            <label class="form-label" for="{{ form.password.id_for_label }}">{{ form.password.label }}</label>
            {{ form.password }}
          </div>

          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-primary w-100">ورود</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
