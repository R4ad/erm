{% with status=action.status %}<span class="badge {% if status == 'verified' %}text-bg-success{% elif status == 'blocked' or status == 'failed' %}text-bg-danger{% elif status == 'ready' %}text-bg-warning{% elif status == 'in_progress' %}text-bg-primary{% elif status == 'approved' %}text-bg-info{% else %}text-bg-light border{% endif %}">{{ action.get_status_display }}</span>{% if action.is_overdue %} <span class="badge text-bg-danger">عقب‌افتاده</span>{% endif %}{% endwith %}
