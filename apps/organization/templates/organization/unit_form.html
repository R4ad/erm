{% extends "base.html" %}

{% block title %}{% if object %}ویرایش واحد{% else %}واحد جدید{% endif %}{% endblock %}

{% block content %}
<div class="row">
  <div class="col-lg-6">
    <h1 class="h4 mb-4">{% if object %}ویرایش واحد{% else %}واحد جدید{% endif %}</h1>

    <form method="post" novalidate>
      {% csrf_token %}
      {% include "includes/form_fields.html" %}
      <button type="submit" class="btn btn-primary">ذخیره</button>
      <a href="{% url 'organization:unit_list' %}" class="btn btn-outline-secondary">انصراف</a>
    </form>
  </div>
</div>
{% endblock %}
