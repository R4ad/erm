{% if risk.status == "registered" %}<span class="badge text-bg-light border">{{ risk.get_status_display }}</span>{% elif risk.is_active %}<span class="badge text-bg-primary">{{ risk.get_status_display }}</span>{% else %}<span class="badge text-bg-secondary">{{ risk.get_status_display }}</span>{% endif %}{% if risk.needs_completion %} <span class="badge text-bg-warning" title="عامل آغازگر، واحد شمارش یا دامنه هنوز نوشته نشده است">نیازمند تکمیل</span>{% endif %}
