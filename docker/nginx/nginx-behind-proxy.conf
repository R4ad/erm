# همان nginx.conf، برای وقتی که nginx دیگری جلوی سامانه است و TLS را تمام می‌کند (docker/behind-proxy.yml).
# به این nginx جز آن پروکسی و خود سرور (127.0.0.1) کسی نمی‌رسد، پس نشانی کاربر و HTTPS بودن را از سرآیندهای همان
# پروکسی می‌پذیریم. این فایل را بدون پروکسی جلویی به کار نبرید: هر کسی می‌تواند این سرآیندها را خودش بفرستد.
server {
    listen 80;
    server_name _;
    client_max_body_size 20M;

    # نشانی واقعی کاربر را پروکسی جلویی در X-Forwarded-For می‌گذارد (سوابق ممیزی همان را ثبت می‌کند).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;

    location /static/ {
        alias /app/staticfiles/;
    }

    # پیوست‌ها فقط با سرآیند X-Accel-Redirect از Django فرستاده می‌شوند؛ internal یعنی نشانی مستقیم کار نمی‌کند.
    location /protected-files/ {
        internal;
        alias /app/media/;
    }

    location / {
        # «web» در شبکه‌ی پروژه‌ی جلویی سرویس همان پروژه است؛ erm-web نام یکتای Django همین سامانه است.
        proxy_pass http://erm-web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
