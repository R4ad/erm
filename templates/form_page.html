{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row">
  <div class="col-lg-6">
    <h1 class="h4 mb-4">{{ title }}</h1>

    <form method="post" novalidate>
      {% csrf_token %}
      {% include "includes/form_fields.html" %}
      <button type="submit" class="btn btn-primary">ذخیره</button>
      <a href="{{ cancel_url }}" class="btn btn-outline-secondary">انصراف</a>
    </form>
  </div>
</div>
{% endblock %}
