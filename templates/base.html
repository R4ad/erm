{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}سامانه مدیریت ریسک{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap.rtl.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <nav class="navbar navbar-expand bg-body-tertiary border-bottom mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'core:home' %}">مدیریت ریسک</a>
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="#">ریسک‌ها</a></li>
        <li class="nav-item"><a class="nav-link" href="#">اقدامات</a></li>
        <li class="nav-item"><a class="nav-link" href="#">گزارش‌ها</a></li>
      </ul>
    </div>
  </nav>

  <main class="container">
    {% for message in messages %}
      <div class="alert alert-info">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>

  <script src="{% static 'vendor/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'vendor/htmx.min.js' %}"></script>
</body>
</html>
