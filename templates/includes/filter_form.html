{% comment %}
  با هر تغییر فیلترها، htmx همین صفحه را می‌گیرد و فقط بخش id="results" را عوض می‌کند.
  پس صفحه‌ای که این فرم را دارد، جدول و صفحه‌بندی را داخل <div id="results"> می‌گذارد.
{% endcomment %}
<form method="get" class="row g-2 align-items-end mb-3"
      hx-get="{{ request.path }}" hx-trigger="submit, input delay:400ms" hx-sync="this:replace"
      hx-target="#results" hx-select="#results" hx-swap="outerHTML" hx-push-url="true">
  {% for field in filter_form %}
    <div class="col-md">
      <label class="form-label small mb-1" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
    </div>
  {% endfor %}
  <div class="col-md-auto">
    <button type="submit" class="btn btn-primary">جست‌وجو</button>
    <a href="{{ request.path }}" class="btn btn-outline-secondary">همه</a>
  </div>
</form>
