<div class="mb-3{% if field.widget_type == 'checkbox' %} form-check{% endif %}">
  {% if field.widget_type == "checkbox" %}
    {{ field }}
    <label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
  {% else %}
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
  {% endif %}

  {% if field.help_text %}
    <div class="form-text" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>
  {% endif %}
  {% if field.errors %}
    <div class="text-danger small mt-1" id="{{ field.auto_id }}_error">
      {% for error in field.errors %}<div>{{ error }}</div>{% endfor %}
    </div>
  {% endif %}
</div>
