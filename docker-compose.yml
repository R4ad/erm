services:
  db:
    image: postgres:17
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    depends_on:
      - db
    volumes:
      - static:/app/staticfiles
    restart: unless-stopped
    profiles: ["prod"]

  nginx:
    image: nginx:stable
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/app/staticfiles:ro
    depends_on:
      - web
    restart: unless-stopped
    profiles: ["prod"]

volumes:
  pgdata:
  static: