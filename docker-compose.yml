services:
  db:
    image: postgres:17
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    image: erm-web:local
    env_file: .env
    environment:
      # inside Docker the database host is the "db" service, not localhost
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # پیوست‌ها را nginx از مسیر internal خودش می‌فرستد (docker/nginx/nginx.conf)
      ATTACHMENT_X_ACCEL_PREFIX: /protected-files/
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static:/app/staticfiles
      - media:/app/media
    networks:
      default:
        # نام یکتا برای nginx؛ وقتی nginx به شبکه‌ی پروژه‌ی دیگری هم وصل است (docker/behind-proxy.yml)، «web» آن‌جا
        # ممکن است سرویس همان پروژه باشد.
        aliases: [erm-web]
    restart: unless-stopped
    profiles: ["prod"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=5).close()"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  monitoring:
    build: .
    image: erm-web:local
    command: ["python", "manage.py", "monitor_risks", "--watch", "--interval", "3600"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["prod"]

  # شناسایی هوشمند ریسک از پاسخنامه؛ تنظیمات LLM_* در ‎.env (‎.env.example).
  ai:
    build: .
    image: erm-web:local
    command: ["python", "manage.py", "run_ai_identification", "--watch", "--interval", "2"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["prod"]

  nginx:
    image: nginx:stable
    ports:
      # پیش‌فرض پورت 80 همه‌ی نشانی‌ها. اگر سرور nginx دیگری جلوی سامانه دارد، در .env مثلاً HTTP_BIND=127.0.0.1:8081
      - "${HTTP_BIND:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/app/staticfiles:ro
      - media:/app/media:ro
    depends_on:
      # nginx نشانی web را هنگام شروع پیدا می‌کند؛ اگر web هنوز آماده نباشد، nginx با خطا می‌ایستد.
      web:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["prod"]

volumes:
  pgdata:
  static:
  media:
